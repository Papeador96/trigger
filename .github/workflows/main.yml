name: Build TriggerBot

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ executable
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "FOUND=0"
          for %%f in (*.cpp) do (
            cl /std:c++20 /O2 /Wall /EHsc "%%f" user32.lib gdi32.lib /Fe:trigger.exe
            if not errorlevel 1 set "FOUND=1"
            goto done
          )
          :done
          if "!FOUND!"=="0" (
            echo No .cpp source files found in repository root.
            exit /b 1
          )

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: trigger-exe
          path: trigger.exe
